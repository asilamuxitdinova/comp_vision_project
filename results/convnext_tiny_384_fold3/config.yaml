seed: 42
run_name: convnext_tiny_384
data:
  processed_dir: data/processed
  img_size: 384
  num_workers: 8
model:
  name: convnext_tiny.fb_in22k_ft_in1k
  pretrained: true
  drop_rate: 0.2
  drop_path_rate: 0.1
train:
  epochs: 30
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 2
  label_smoothing: 0.1
  class_weights: sqrt_inverse
  amp: bf16
  grad_clip: 1.0
  early_stopping_patience: 7
  monitor: balanced_accuracy
eval:
  tta: true
  gradcam_images: 24
