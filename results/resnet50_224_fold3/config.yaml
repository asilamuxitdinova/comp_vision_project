seed: 42
run_name: resnet50_224
data:
  processed_dir: data/processed
  img_size: 224
  num_workers: 8
model:
  name: resnet50.a1_in1k
  pretrained: true
  drop_rate: 0.2
  drop_path_rate: 0.05
train:
  epochs: 30
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.01
  warmup_epochs: 2
  label_smoothing: 0.1
  class_weights: sqrt_inverse
  amp: bf16
  grad_clip: 1.0
  early_stopping_patience: 7
  monitor: balanced_accuracy
eval:
  tta: true
  gradcam_images: 24
